[build-system]
requires = [
  "setuptools >= 77",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "django-blog-core"
description = "Reusable multi-blog Django app: Blog, Section, Article with draft/schedule/publish, feeds, hookset, and optional Markdown/sanitize extras."
authors = [
    { name = "DLRSP", email = "dlrsp.dev@gmail.com" },
]
requires-python = ">=3.10"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "django",
    "blog",
    "articles",
    "cms",
    "syndication",
    "rss",
    "atom",
    "markdown",
    "multi-blog",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "Django>=3.2",
]

[project.urls]
Homepage = "https://github.com/DLRSP/django-blog-core"
Documentation = "https://dlrsp.github.io/django-blog-core/"
Repository = "https://github.com/DLRSP/django-blog-core"
Issues = "https://github.com/DLRSP/django-blog-core/issues"
Changelog = "https://github.com/DLRSP/django-blog-core/blob/main/CHANGELOG.rst"
Funding = "https://github.com/sponsors/DLRSP"

[project.optional-dependencies]
markdown = [
    "markdown>=3.5",
]
sanitize = [
    "bleach>=6.0",
]
search = []
tags = []
social = []
images = []
events = []
all = [
    "markdown>=3.5",
    "bleach>=6.0",
]
testing = [
    "coverage",
    "codecov",
    "pytest",
    "pytest-django",
    "markdown>=3.5",
    "bleach>=6.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "pymdown-extensions>=10.0",
    "mkdocs-git-revision-date-plugin>=2.0",
]
linting = [
    "flake8",
    "flake8-pyproject",
    "flake8-bugbear",
    "flake8-comprehensions",
    "flake8-tidy-imports",
    "flake8-typing-imports",
    "pylint",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "blog_core.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/django-blog-core/requirements" = [
  "requirements/py310-django42.txt",
  "requirements/py310-django52.txt",
  "requirements/py311-django42.txt",
  "requirements/py311-django52.txt",
  "requirements/py312-django42.txt",
  "requirements/py312-django52.txt",
  "requirements/py313-django52.txt",
  "requirements/py314-django52.txt",
]

[tool.distutils.bdist_wheel]
universal = false

[tool.black]
line-length = 80
target-version = ['py311']

[tool.isort]
profile = "black"

[tool.check-manifest]
ignore = [
    "AGENTS.md",
]

[tool.flake8]
max-line-length = 80
select = ["E", "F", "W", "B", "B950", "C", "I", "TYP"]
ignore = ["E203", "E501", "W503", "B950"]
per-file-ignores = [
    "**/migrations/*:B950",
]

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
mypy_path = "src/"
no_implicit_optional = true
show_error_codes = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true

[tool.pytest.ini_options]
addopts = """\
    --strict-config
    --strict-markers
    --ds=tests.settings
    """
django_find_project = false
pythonpath = ["src"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.run]
branch = true
source = ["blog_core"]

[tool.coverage.report]
show_missing = true

[tool.towncrier]
package = "blog_core"
package_dir = "src"
filename = "CHANGELOG.rst"
directory = "news/"
version = "0.1.4"
issue_format = "`#{issue} <https://github.com/DLRSP/django-blog-core/issues/{issue}>`_"
type = [
  { name = "Process",                   directory = "process", showcontent = true },
  { name = "Deprecations and Removals", directory = "removal", showcontent = true },
  { name = "Features",                  directory = "feature", showcontent = true },
  { name = "Bug Fixes",                 directory = "bugfix",  showcontent = true },
  { name = "Vendored Libraries",        directory = "vendor",  showcontent = true },
  { name = "Improved Documentation",    directory = "doc",     showcontent = true },
  { name = "Trivial Changes",           directory = "trivial", showcontent = false },
]

[tool.bumpversion]
current_version = "0.1.4"
commit = true
tag = true
allow_dirty = true

[[tool.bumpversion.files]]
filename = "./src/blog_core/__init__.py"
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'current_version = "{current_version}"'
replace = 'current_version = "{new_version}"'
